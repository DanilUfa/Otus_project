global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: vacation-api
    static_configs:
      - targets: ['host.docker.internal:5100']
        labels: { service: api }
  - job_name: vacation-services
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels: { service: gateway }
      - targets: ['host.docker.internal:5300']
        labels: { service: audit }
      - targets: ['host.docker.internal:5200']
        labels: { service: reporting }
      - targets: ['host.docker.internal:9401']
        labels: { service: notifier }
      - targets: ['host.docker.internal:9402']
        labels: { service: scheduler }
